services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agent_gateway
      POSTGRES_USER: agent_gateway
      POSTGRES_PASSWORD: agent_gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_gateway -d agent_gateway"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.7
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.133.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      clickhouse:
        condition: service_healthy

  api:
    build: .
    environment:
      PORT: "8080"
      HOST: 0.0.0.0
      POSTGRES_URL: postgres://agent_gateway:agent_gateway@postgres:5432/agent_gateway
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: otel
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      PROJECTION_INTERVAL_MS: "5000"
      STALE_AFTER_SECONDS: "120"
      AUTH_ENABLED: "${AUTH_ENABLED:-true}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin}"
      # Gateway-hosted agent execution. The gateway inherits the API credential
      # from its own environment; it does not manage or store keys.
      AGENT_ENABLED: "${AGENT_ENABLED:-true}"
      AGENT_WORKSPACE: /workspace
      AGENT_OTEL_ENDPOINT: http://otel-collector:4317
      AGENT_PERMISSION_MODE: "${AGENT_PERMISSION_MODE:-bypassPermissions}"
      AGENT_MODEL: "${AGENT_MODEL:-}"
      # Credentials for hosted runs — read from .env, passed through. The gateway
      # does not manage keys; it only forwards what the environment provides.
      # --- Amazon Bedrock via a long-lived IAM user (access key + secret) ---
      CLAUDE_CODE_USE_BEDROCK: "${CLAUDE_CODE_USE_BEDROCK:-}"
      AWS_REGION: "${AWS_REGION:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      # Only needed for temporary/STS credentials; leave empty for a long-lived key.
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      # --- Or: Anthropic API directly (leave the Bedrock block empty) ---
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_AUTH_TOKEN: "${ANTHROPIC_AUTH_TOKEN:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-}"
    ports:
      - "8080:8080"
    volumes:
      - agent-workspace:/workspace
      # Persist ~/.claude so hosted-session transcripts survive container
      # recreation; without this, `resume` breaks after every rebuild because
      # the resume state lives in the ephemeral writable layer. HOME=/home/node.
      - agent-home:/home/node/.claude
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      otel-collector:
        condition: service_started

volumes:
  postgres-data:
  clickhouse-data:
  agent-workspace:
  agent-home:
