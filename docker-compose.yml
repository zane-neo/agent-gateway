services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agent_gateway
      POSTGRES_USER: agent_gateway
      POSTGRES_PASSWORD: agent_gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_gateway -d agent_gateway"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.7
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.133.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      clickhouse:
        condition: service_healthy

  api:
    build: .
    environment:
      PORT: "8080"
      HOST: 0.0.0.0
      POSTGRES_URL: postgres://agent_gateway:agent_gateway@postgres:5432/agent_gateway
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: otel
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      PROJECTION_INTERVAL_MS: "5000"
      STALE_AFTER_SECONDS: "120"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

volumes:
  postgres-data:
  clickhouse-data:
